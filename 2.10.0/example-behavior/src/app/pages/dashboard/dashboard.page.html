<ion-header>
  <ion-toolbar color="bluefp">
    <ion-title class="labelTitleSelphi">360 Behavior</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="centered-content">
  <ion-grid class="centered-grid">
    <ion-row class="titleRow">
      <ion-col class="buttonColSdk">
        <h1 class="screenTitle">Dashboard</h1>
        <p class="screenSubtitle">Signed in as {{ user }}</p>
      </ion-col>
    </ion-row>

    <ion-row *ngIf="showError" class="messageRowSdk">
      <ion-col class="buttonColSdk">
        <ion-label class="errorLabel">{{ message }}</ion-label>
      </ion-col>
    </ion-row>

    <ion-row class="buttonRowSdk">
      <ion-col class="buttonColSdk">
        <ion-button class="buttonSdk" color="bluefp" (click)="goToHome()">Go to Home</ion-button>
      </ion-col>
    </ion-row>

    <ion-row class="buttonRowSdk">
      <ion-col class="buttonColSdk">
        <ion-button class="buttonSdk" color="bluefp" fill="outline" (click)="onLogout()">Logout</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
